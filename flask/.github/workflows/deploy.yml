# Archivo: .github/workflows/deploy.yml
name: Deploy Flask Model

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Instalar dependencias de Python para update script
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Construir la imagen Docker
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-model:latest .

    - name: Iniciar sesión en Docker Hub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    - name: Push de la imagen a Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-model:latest

    - name: Obtener la última URI del modelo desde MLflow
      # Aquí puedes ejecutar un script similar al anterior para obtener la URI desde MLflow.
      # Por simplicidad, se asume que la variable de entorno MODEL_URI se define en los secrets.
      run: echo "Usando MLFLOW_MODEL_URI = ${{ secrets.MLFLOW_MODEL_URI }}"
      env:
        MLFLOW_MODEL_URI: ${{ secrets.MLFLOW_MODEL_URI }}

    - name: Actualizar YAML de despliegue
      run: |
        python update_flask_deployment.py "${{ secrets.MLFLOW_MODEL_URI }}"

    - name: Configurar kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.26.0'

    - name: Configurar kubeconfig
      env:
        KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
      run: |
        echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config

    - name: Desplegar la API Flask en Kubernetes
      run: |
        kubectl apply -f flask_deployment.yaml
