# Archivo: .github/workflows/deploy.yml
name: Deploy MLflow Model Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Instalar dependencias para el script de actualización
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Construir la imagen Docker
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlflow-model-server:latest .

    - name: Iniciar sesión en Docker Hub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    - name: Push de la imagen a Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlflow-model-server:latest

    - name: Actualizar YAML de despliegue con la URI del modelo
      run: |
        python update_mlserver_deployment.py "${{ secrets.MLFLOW_MODEL_URI }}"

    - name: Configurar kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.26.0'

    - name: Configurar kubeconfig
      env:
        KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
      run: |
        echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config

    - name: Desplegar en Kubernetes
      run: |
        kubectl apply -f mlflow_deployment.yaml
